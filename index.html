<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Carc's Compression Algorithms</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="page">

        <!-- RLE / Huffman toggle -->
        <div class="toggle">

            <input type="radio" id="option1" name="option" checked>
            <label for="option1">RLE</label>

            <input type="radio" id="option2" name="option">
            <label for="option2">Huffman</label>

            <div class="slider"></div>

        </div>


        <!-- RLE content -->
        <div id="rle-content" class="content">

            <h1>RLE Compression</h1>

            <p>Enter text to be compressed using RLE.</p>

            <input type="text" placeholder="Enter text">

        </div>


        <!-- Huffman content -->
        <div id="huffman-content" class="content">

            <h1>Huffman Compression</h1>

            <p>Enter text to be compressed using Huffman coding.</p>

            <input type="text" placeholder="Enter text">

        </div>

    </div>


    <script>

        const rle = document.getElementById("rle-content");
        const huffman = document.getElementById("huffman-content");

        document.getElementById("option1").addEventListener("change", () => {
            rle.style.display = "block";
            huffman.style.display = "none";
        });

        document.getElementById("option2").addEventListener("change", () => {
            rle.style.display = "none";
            huffman.style.display = "block";
        });

    </script>

</body>

</html>
